# CI и выпуск @verdeect/auth (prd.md r5: FR-11, UC-3, AC-8, §11, D-7, D-8 — GitHub Actions, npm Trusted Publishing).
#
# Jobs FR-11, связанные через needs: lint → test → build → publish; каждый ставит зависимости сам (make install).
# Проверки — на каждый push в ветку и pull_request. test — матрица Node 22 и 24; lint и build — Node 22
# (минимальная поддерживаемая версия, engines.node ">=22.12"); publish — Node 24 и npm >= 11.15 (Trusted Publishing).
# publish — только на тег v<major>.<minor>.<patch> после зелёных проверок, GitHub-hosted runner: scripts/publish.mjs
# сверяет тег с version, проверяет, что версии нет в npm, и запускает npm publish --access public из собранного dist/.
#
# Разовая настройка (docs/releasing.md):
#   - environment `npm` с правилом развёртывания «только теги v*»;
#   - ruleset на теги v*: создание — только мейнтейнеры, удаление и перезапись запрещены;
#   - секретов нет: NPM_TOKEN / NODE_AUTH_TOKEN не используются, публикация только через OIDC (id-token: write);
#   - 1.0.0 мейнтейнер публикует вручную (D-8), затем npm trust github (smskin/verdeect-auth, ci.yml, environment npm)
#     и запрет публикации токенами. Job publish для тега v1.0.0 падает на «версия уже опубликована» — это ожидаемо.
# continue-on-error нигде не используется.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: make install
        run: make install
      - name: make lint
        run: make lint
      - name: make analyse
        run: make analyse

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: make install
        run: make install
      - name: make test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: make install
        run: make install
      - name: make build pack-check
        run: make build pack-check
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    # Права job заменяют права workflow целиком: contents — для checkout, id-token — для npm Trusted Publishing (OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Без registry-url: .npmrc с _authToken=${NODE_AUTH_TOKEN} не нужен, реестр по умолчанию — registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Trusted Publishing требует npm >= 11.15; npm из Node 24 может быть старее.
      - name: npm >= 11.15
        run: npm install -g npm@^11.15.0
      - name: npm version
        run: npm --version
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Авторизация — только OIDC (Trusted Publishing): npm обменивает id-token на токен публикации. Секретов нет (D-8).
      - name: publish
        run: node scripts/publish.mjs
